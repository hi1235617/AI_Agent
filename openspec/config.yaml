# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  # AI_Agent Project - 基于 nanobot 的 AI Agent 开发项目
  ## 项目概述
  本项目基于 nanobot（https://github.com/HKUDS/nanobot）进行开发，是一个轻量级的个人 AI 助手框架。
  项目版本：v0.1.4.post5
  支持 Python 3.11 / 3.12

  ## 核心能力
  - 多 LLM 提供商支持：通过 LiteLLM 集成 OpenAI、Anthropic、DeepSeek、智谱AI、月之暗面、Gemini、阿里云通义千问等，支持本地部署（vLLM、Ollama）及网关（OpenRouter、SiliconFlow、火山引擎等）
  - 多消息渠道支持：钉钉、飞书、Telegram、Slack、企业微信、微信、Matrix、QQ 等
  - 工具调用系统：内置网页抓取、搜索、文件操作等工具，支持自定义扩展
  - MCP 协议支持：兼容 Model Context Protocol
  - 技能系统：支持扩展各类领域技能
  - 定时任务：通过 Cron 表达式实现定时触发

  ## 技术栈
  - **后端**: Python 3.11+
  - **核心框架**: nanobot
  - **多 LLM 支持**: LiteLLM
  - **配置管理**: Pydantic, Pydantic Settings
  - **桥接服务**: TypeScript, Node.js (用于 WhatsApp 集成)
  - **测试**: pytest
  - **代码规范**: Ruff
  - **打包**: Hatchling
  - **CLI**: Typer

  ## 项目结构
  ```
  ./
  ├── nanobot/          # 核心 Python 包
  │   ├── agent/        # Agent 运行时、工具处理、循环逻辑
  │   ├── channels/     # 消息渠道实现
  │   ├── providers/    # LLM 提供商集成
  │   ├── cli/          # CLI 命令定义
  │   ├── config/       # 配置管理
  │   └── utils/        # 共享工具函数
  ├── bridge/           # TypeScript 桥接组件
  │   └── src/          # 桥接源码
  ├── tests/            # 测试套件
  ├── openspec/         # OpenSpec 变更管理配置
  └── pyproject.toml    # 项目配置
  ```

  ## 开发指南
  | 任务 | 位置 | 说明 |
  |------|----------|-------|
  | 添加新 LLM 提供商 | `nanobot/providers/` | 实现 Provider 接口 |
  | 添加新消息渠道 | `nanobot/channels/` | 继承 BaseChannel 类 |
  | 添加新 Agent 工具 | `nanobot/agent/tools/` | 实现 Tool 接口 |
  | 修改 CLI 命令 | `nanobot/cli/` | 使用 Typer 框架 |
  | 桥接服务修改 | `bridge/src/` | TypeScript 代码，使用 `tsc` 构建 |
  | 测试实现 | `tests/` | 遵循 `test_*.py` 命名规范 |

  ## 开发约定
  - 使用 `pyproject.toml` 统一管理配置（无单独的 pytest.ini/ruff.toml）
  - 代码规范：Ruff linting，line-length=100，忽略 E501
  - 测试使用 pytest，asyncio_mode="auto"
  - 异步代码使用原生 async/await
  - 使用 .venv 虚拟环境进行开发，相关依赖已预安装，使用虚拟环境需要先使用conda activate进入conda环境
  - 桥接组件需单独构建，输出到 `bridge/dist/`

  ## 反模式
  - 不要假设存在 `grep`/`sed`/`awk` 等 GNU 工具（需兼容 Windows）
  - 禁止空的 `catch(e) {}` 块，必须处理或记录错误
  - TypeScript 代码避免使用 `as any`/`@ts-ignore`

  ## 常用命令
  ```bash
  # 安装依赖
  uv pip install -e ".[dev]"
  
  # 代码检查
  ruff check .
  
  # 运行测试
  pytest
  
  # 构建 Python 包
  hatch build
  
  # 构建 TypeScript 桥接
  cd bridge && npm install && npm run build
  
  # 运行 CLI
  nanobot --help
  ```

  ## 当前配置
  - 默认使用通义千问 qwen-max 模型
  - 通过阿里云 DashScope 提供商调用
  - 配置文件位于 `.nanobot/config.json`

